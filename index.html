<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Danfo Rush</title>
<style>
  :root{--bg:#05060d;--cyan:#13f2ff;--pink:#ff2bd6;--yellow:#ffd21a;--green:#39ff88}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);touch-action:none;user-select:none;-webkit-user-select:none;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
  canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;background:#05060d;touch-action:none}
  .touchControls{position:fixed;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom));display:none;align-items:flex-end;justify-content:space-between;padding:0 18px;pointer-events:none;z-index:5}
  .padSide{display:flex;gap:14px;pointer-events:auto}
  .touchBtn{width:74px;height:74px;border-radius:24px;border:1px solid rgba(19,242,255,.55);background:linear-gradient(180deg,rgba(13,24,44,.72),rgba(5,9,20,.88));color:#e9fbff;font-size:34px;font-weight:900;box-shadow:0 0 18px rgba(19,242,255,.25),inset 0 0 20px rgba(19,242,255,.09);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);touch-action:none}
  .touchBtn:active{transform:translateY(2px) scale(.97);box-shadow:0 0 26px rgba(255,43,214,.34),inset 0 0 28px rgba(255,43,214,.14);border-color:rgba(255,43,214,.7)}
  .pauseBtn{width:62px;height:62px;border-radius:20px;font-size:24px;margin-bottom:6px}
  @media (hover:none),(max-width:820px){.touchControls{display:flex}.touchBtn{width:70px;height:70px}.pauseBtn{width:60px;height:60px}}
  @media (max-width:380px){.touchBtn{width:62px;height:62px;border-radius:20px;font-size:30px}.pauseBtn{width:54px;height:54px}}
</style>
</head>
<body>
<canvas id="game" aria-label="Danfo Rush game"></canvas>
<div class="touchControls" aria-hidden="true">
  <div class="padSide">
    <button class="touchBtn" id="leftBtn">‹</button>
    <button class="touchBtn" id="rightBtn">›</button>
  </div>
  <button class="touchBtn pauseBtn" id="pauseBtn">Ⅱ</button>
</div>
<script>
(()=>{"use strict";
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d",{alpha:false});
const leftBtn=document.getElementById("leftBtn"),rightBtn=document.getElementById("rightBtn"),pauseBtn=document.getElementById("pauseBtn");
const KEY="vmf_danfo_rush_highscore_v1",LANES=4,WIN_PAX=20;
let W=1,H=1,DPR=1,roadX=0,roadW=1,laneW=1,last=0,state="title",shake=0,flash=0;
let high=0;try{high=Number(localStorage.getItem(KEY)||0)||0}catch(e){high=0}
let player,obstacles=[],passengers=[],particles=[],laneCd=[0,0,0,0],sky=[],stars=[];
let time=0,score=0,pax=0,lives=3,level=1,roadScroll=0,obsTimer=0.7,paxTimer=1.9,invuln=0,streak=0,gameEnded=false;
let ac=null,master=null;
function resize(){
  DPR=Math.max(1,Math.min(3,window.devicePixelRatio||1));
  W=Math.max(320,Math.floor(window.innerWidth||document.documentElement.clientWidth||320));
  H=Math.max(480,Math.floor(window.innerHeight||document.documentElement.clientHeight||480));
  canvas.style.width=W+"px";canvas.style.height=H+"px";
  canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  roadW=Math.min(W*0.9,720); if(W<520)roadW=W*0.94;
  roadX=(W-roadW)/2; laneW=roadW/LANES;
  if(player){player.y=H*.78;player.x=laneCenter(player.lane);player.targetX=player.x}
  buildBackdrop();
}
function buildBackdrop(){
  sky=[];stars=[];
  let n=Math.ceil(W/42)+8;
  for(let i=0;i<n;i++){
    let side=i%2, bw=28+Math.random()*54, bh=70+Math.random()*220;
    sky.push({side,bw,bh,x:Math.random()*Math.max(20,(W-roadW)/2-18),lit:Math.random()});
  }
  for(let i=0;i<90;i++)stars.push({x:Math.random()*W,y:Math.random()*H*.62,r:.4+Math.random()*1.4,a:.18+Math.random()*.55});
}
window.addEventListener("resize",resize,{passive:true});resize();
function safeStore(){try{localStorage.setItem(KEY,String(Math.floor(high)))}catch(e){}}
function audioStart(){
  try{
    if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.22;master.connect(ac.destination)}
    if(ac.state==="suspended")ac.resume();
  }catch(e){ac=null}
}
function tone(f,d=.08,type="sine",v=.45,bend=1,delay=0){
  if(!ac||!master)return;
  const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);
  if(bend!==1)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*bend),t+d);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.02);
}
function noise(d=.18,v=.55){
  if(!ac||!master)return;
  const len=Math.max(1,Math.floor(ac.sampleRate*d)),buf=ac.createBuffer(1,len,ac.sampleRate),data=buf.getChannelData(0);
  for(let i=0;i<len;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);
  const src=ac.createBufferSource(),g=ac.createGain(),fil=ac.createBiquadFilter();
  fil.type="lowpass";fil.frequency.value=900;g.gain.value=v;src.buffer=buf;src.connect(fil);fil.connect(g);g.connect(master);src.start();
}
function sfx(name){
  if(name==="move"){tone(210,.045,"triangle",.15,1.45)}
  if(name==="collect"){tone(620,.08,"sine",.32,1.15,0);tone(910,.09,"sine",.28,1.1,.055);tone(1280,.12,"triangle",.22,.92,.12)}
  if(name==="hit"){noise(.28,.75);tone(110,.22,"sawtooth",.35,.42)}
  if(name==="start"){tone(260,.09,"triangle",.2,1.4);tone(520,.12,"sine",.25,1.3,.08);tone(1040,.16,"sine",.22,1.1,.18)}
  if(name==="win"){tone(520,.12,"triangle",.27,1.05);tone(780,.14,"triangle",.27,1.05,.13);tone(1040,.18,"sine",.28,1.15,.27)}
}
function laneCenter(l){return roadX+laneW*(l+.5)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function reset(){
  time=0;score=0;pax=0;lives=3;level=1;roadScroll=0;obsTimer=.75;paxTimer=1.5;invuln=0;streak=0;gameEnded=false;shake=0;flash=0;
  obstacles=[];passengers=[];particles=[];laneCd=[0,0,0,0];
  player={lane:1,x:laneCenter(1),targetX:laneCenter(1),y:H*.78,w:Math.min(laneW*.58,64),h:Math.min(laneW*1.15,104)};
}
function startGame(){audioStart();reset();state="playing";sfx("start")}
function endGame(win){
  if(gameEnded)return;gameEnded=true;state=win?"win":"over";flash=win?.35:.18;shake=win?8:18;
  score+=win?2500+lives*600:0;if(score>high){high=Math.floor(score);safeStore()}
  sfx(win?"win":"hit");
}
function moveLane(dir){
  if(state!=="playing")return;
  const nl=clamp(player.lane+dir,0,LANES-1);
  if(nl!==player.lane){player.lane=nl;player.targetX=laneCenter(nl);spawnParticles(player.x,player.y+player.h*.35,"#13f2ff",7,95);sfx("move")}
}
function togglePause(){audioStart();if(state==="playing")state="paused";else if(state==="paused")state="playing"}
function anyStart(){audioStart();if(state==="title"||state==="over"||state==="win")startGame();else if(state==="paused")state="playing"}
document.addEventListener("keydown",e=>{
  if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," ","Spacebar"].includes(e.key))e.preventDefault();
  audioStart();
  if(e.key==="p"||e.key==="P"){togglePause();return}
  if(state==="title"||state==="over"||state==="win"){if(e.key==="Enter"||e.key===" "||e.key==="Spacebar")startGame();return}
  if(state==="playing"){
    if(e.key==="ArrowLeft"||e.key==="a"||e.key==="A")moveLane(-1);
    if(e.key==="ArrowRight"||e.key==="d"||e.key==="D")moveLane(1);
  }
},{passive:false});
canvas.addEventListener("pointerdown",e=>{
  e.preventDefault();audioStart();
  if(state==="title"||state==="over"||state==="win"){startGame();return}
  if(state==="paused"){state="playing";return}
  if(state==="playing"){
    const y=e.clientY,x=e.clientX;
    if(y>H*.62)moveLane(x<W/2?-1:1);
  }
},{passive:false});
for(const [b,fn] of [[leftBtn,()=>moveLane(-1)],[rightBtn,()=>moveLane(1)],[pauseBtn,()=>togglePause()]]){
  b.addEventListener("pointerdown",e=>{e.preventDefault();audioStart();if(state==="title"||state==="over"||state==="win")startGame();else fn()},{passive:false});
}
document.addEventListener("touchmove",e=>e.preventDefault(),{passive:false});
function freeLane(){
  let best=0,min=999;
  for(let i=0;i<LANES;i++){if(laneCd[i]<min){min=laneCd[i];best=i}}
  for(let k=0;k<12;k++){let l=(Math.random()*LANES)|0;if(laneCd[l]<=0)return l}
  return best;
}
function spawnObstacle(){
  const l=freeLane(),types=["car","keke","suv","okada"],type=types[(Math.random()*types.length)|0];
  const base=Math.min(laneW*.68,76),h=type==="okada"?base*1.25:base*(1.45+Math.random()*.35);
  const w=type==="okada"?base*.5:type==="keke"?base*.72:base;
  const colors={car:"#ff2bd6",keke:"#39ff88",suv:"#8f5dff",okada:"#13f2ff"};
  obstacles.push({lane:l,y:-h-30-Math.random()*90,w,h,type,color:colors[type],vy:Math.random()*55,scored:false,hit:false});
  laneCd[l]=Math.max(laneCd[l],.62+Math.random()*.28);
}
function spawnPassenger(){
  const l=freeLane();
  passengers.push({lane:l,y:-42-Math.random()*70,r:18+Math.random()*5,phase:Math.random()*6.28});
  laneCd[l]=Math.max(laneCd[l],.35);
}
function spawnParticles(x,y,c,n=12,pow=140){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=(.25+Math.random())*pow;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.35+Math.random()*.45,max:.8,sz:2+Math.random()*4,c});
  }
}
function rectHit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function playerRect(){return{x:player.x-player.w*.42,y:player.y-player.h*.43,w:player.w*.84,h:player.h*.82}}
function update(dt){
  time+=dt;level=1+Math.floor(time/18)+Math.floor(pax/5);
  const speed=250+level*27+Math.min(110,time*1.6);
  roadScroll+=speed*dt;
  invuln=Math.max(0,invuln-dt);flash=Math.max(0,flash-dt);shake=Math.max(0,shake-dt*24);
  for(let i=0;i<LANES;i++)laneCd[i]=Math.max(0,laneCd[i]-dt);
  player.w=Math.min(laneW*.58,64);player.h=Math.min(laneW*1.15,104);player.y=H*.78;player.targetX=laneCenter(player.lane);
  player.x+=(player.targetX-player.x)*(1-Math.exp(-dt*13));
  score+=dt*(7+level*1.5);
  obsTimer-=dt;paxTimer-=dt;
  if(obsTimer<=0){
    spawnObstacle();
    if(level>5&&Math.random()<.18)spawnObstacle();
    obsTimer=Math.max(.32,.98-level*.055)*(0.72+Math.random()*.68);
  }
  if(paxTimer<=0){
    spawnPassenger();
    paxTimer=Math.max(1.15,2.45-level*.035)*(0.75+Math.random()*.7);
  }
  const pr=playerRect();
  for(let i=obstacles.length-1;i>=0;i--){
    const o=obstacles[i];o.y+=(speed+o.vy)*dt;
    const ox=laneCenter(o.lane),or={x:ox-o.w/2,y:o.y-o.h/2,w:o.w,h:o.h};
    if(!o.scored&&o.y>player.y+player.h*.6){o.scored=true;score+=22+level*4}
    if(invuln<=0&&rectHit(pr,or)){
      obstacles.splice(i,1);lives--;streak=0;invuln=1.35;shake=18;flash=.16;
      spawnParticles(player.x,player.y,"#ff2bd6",34,250);sfx("hit");
      if(lives<=0)endGame(false);
      continue;
    }
    if(o.y>H+150)obstacles.splice(i,1);
  }
  for(let i=passengers.length-1;i>=0;i--){
    const p=passengers[i];p.phase+=dt*5;p.y+=speed*dt*.93;
    const px=laneCenter(p.lane),dy=p.y-player.y,dx=px-player.x;
    if(Math.abs(dx)<player.w*.62&&Math.abs(dy)<player.h*.6){
      passengers.splice(i,1);pax++;streak++;score+=340+streak*45+level*20;shake=Math.max(shake,5);
      spawnParticles(px,p.y,"#ffd21a",26,185);sfx("collect");
      if(pax>=WIN_PAX)endGame(true);
      continue;
    }
    if(p.y>H+80){passengers.splice(i,1);streak=0}
  }
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(.08,dt);p.vy*=Math.pow(.08,dt);p.vy+=90*dt;
    if(p.life<=0)particles.splice(i,1);
  }
  if(score>high){high=Math.floor(score);safeStore()}
}
function neonText(txt,x,y,size,color,align="center",weight=900){
  ctx.save();ctx.textAlign=align;ctx.textBaseline="middle";ctx.font=`${weight} ${size}px system-ui,-apple-system,Segoe UI,sans-serif`;
  ctx.shadowBlur=size*.55;ctx.shadowColor=color;ctx.fillStyle=color;ctx.fillText(txt,x,y);
  ctx.shadowBlur=0;ctx.fillStyle="#f7fdff";ctx.globalAlpha=.86;ctx.fillText(txt,x,y-size*.025);ctx.restore();
}
function drawBackground(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#070817");g.addColorStop(.55,"#050611");g.addColorStop(1,"#020308");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.save();
  for(const s of stars){ctx.globalAlpha=s.a*(.65+.35*Math.sin(time*1.7+s.x));ctx.fillStyle="#bdfcff";ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}
  ctx.globalAlpha=1;
  const sideW=Math.max(10,(W-roadW)/2);
  for(let i=0;i<sky.length;i++){
    const b=sky[i],left=b.side===0,x=left?b.x:W-b.x-b.bw,y=H-b.bh-30+(i%5)*9;
    ctx.fillStyle="rgba(3,8,20,.88)";ctx.fillRect(x,y,b.bw,b.bh+40);
    ctx.strokeStyle=i%3?"rgba(19,242,255,.23)":"rgba(255,43,214,.2)";ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,b.bw-1,b.bh+39);
    const wx=Math.floor(b.bw/13),wy=Math.floor(b.bh/18);
    for(let yy=0;yy<wy;yy++)for(let xx=0;xx<wx;xx++)if(((xx*17+yy*7+i)%5)===0){
      ctx.fillStyle=((xx+yy+i)%2)?"rgba(19,242,255,.55)":"rgba(255,210,26,.5)";
      ctx.fillRect(x+5+xx*13,y+7+yy*18,4,7);
    }
  }
  const glow=ctx.createRadialGradient(W/2,H*.55,10,W/2,H*.55,Math.max(W,H)*.7);
  glow.addColorStop(0,"rgba(255,43,214,.14)");glow.addColorStop(.5,"rgba(19,242,255,.055)");glow.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);ctx.restore();
}
function drawRoad(){
  ctx.save();
  ctx.fillStyle="#090b14";ctx.fillRect(roadX-10,0,roadW+20,H);
  let rg=ctx.createLinearGradient(roadX,0,roadX+roadW,0);
  rg.addColorStop(0,"#080a12");rg.addColorStop(.5,"#10131f");rg.addColorStop(1,"#080a12");
  ctx.fillStyle=rg;ctx.fillRect(roadX,0,roadW,H);
  ctx.shadowBlur=18;ctx.lineWidth=3;ctx.strokeStyle="#13f2ff";ctx.shadowColor="#13f2ff";
  ctx.beginPath();ctx.moveTo(roadX+3,0);ctx.lineTo(roadX+3,H);ctx.moveTo(roadX+roadW-3,0);ctx.lineTo(roadX+roadW-3,H);ctx.stroke();
  ctx.shadowBlur=12;ctx.strokeStyle="#ff2bd6";ctx.shadowColor="#ff2bd6";ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(roadX+11,0);ctx.lineTo(roadX+11,H);ctx.moveTo(roadX+roadW-11,0);ctx.lineTo(roadX+roadW-11,H);ctx.stroke();
  ctx.shadowBlur=0;
  const dash=46,gap=34,off=roadScroll%(dash+gap);
  for(let l=1;l<LANES;l++){
    const x=roadX+laneW*l;ctx.strokeStyle="rgba(233,251,255,.42)";ctx.lineWidth=2;ctx.setLineDash([dash,gap]);ctx.lineDashOffset=off;
    ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();ctx.setLineDash([]);
  }
  for(let y=-80+(roadScroll*.55%120);y<H+120;y+=120){
    ctx.globalAlpha=.08;ctx.fillStyle="#13f2ff";ctx.fillRect(roadX,y,roadW,1);ctx.globalAlpha=1;
  }
  ctx.restore();
}
function drawVehicle(o){
  const x=laneCenter(o.lane),y=o.y,w=o.w,h=o.h;
  ctx.save();ctx.translate(x,y);
  ctx.shadowBlur=16;ctx.shadowColor=o.color;ctx.fillStyle=o.color;
  if(o.type==="okada"){
    ctx.fillStyle="#0b1020";rr(-w*.3,-h*.35,w*.6,h*.7,9);ctx.fill();ctx.strokeStyle=o.color;ctx.lineWidth=3;ctx.stroke();
    ctx.fillStyle=o.color;ctx.beginPath();ctx.arc(0,-h*.46,w*.22,0,Math.PI*2);ctx.arc(0,h*.46,w*.22,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#f7fdff";ctx.fillRect(-w*.09,-h*.05,w*.18,h*.23);
  }else{
    rr(-w/2,-h/2,w,h,12);ctx.fill();
    ctx.fillStyle="rgba(3,8,18,.72)";rr(-w*.34,-h*.26,w*.68,h*.25,7);ctx.fill();rr(-w*.34,h*.04,w*.68,h*.23,7);ctx.fill();
    ctx.fillStyle="#f7fdff";ctx.globalAlpha=.9;ctx.fillRect(-w*.34,h*.39,w*.18,5);ctx.fillRect(w*.16,h*.39,w*.18,5);
    ctx.globalAlpha=1;ctx.fillStyle="rgba(255,255,255,.18)";ctx.fillRect(-w*.42,-h*.08,w*.84,2);
  }
  ctx.restore();
}
function drawPassenger(p){
  const x=laneCenter(p.lane),y=p.y+Math.sin(p.phase)*5;
  ctx.save();ctx.translate(x,y);ctx.shadowBlur=20;ctx.shadowColor="#ffd21a";
  ctx.fillStyle="#ffd21a";ctx.beginPath();ctx.arc(0,-13,8,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="#ffd21a";ctx.lineWidth=5;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(0,-4);ctx.lineTo(0,14);ctx.moveTo(-13,4);ctx.lineTo(13,4);ctx.moveTo(0,14);ctx.lineTo(-10,28);ctx.moveTo(0,14);ctx.lineTo(10,28);ctx.stroke();
  ctx.globalAlpha=.18;ctx.fillStyle="#ffd21a";ctx.beginPath();ctx.arc(0,4,28+Math.sin(time*5+p.phase)*3,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
function drawBus(){
  const x=player.x,y=player.y,w=player.w,h=player.h,blink=invuln>0&&Math.floor(invuln*12)%2===0;
  if(blink)ctx.globalAlpha=.46;
  ctx.save();ctx.translate(x,y);
  ctx.shadowBlur=22;ctx.shadowColor="#ffd21a";ctx.fillStyle="#ffd21a";rr(-w/2,-h/2,w,h,14);ctx.fill();
  ctx.fillStyle="#151913";rr(-w*.39,-h*.34,w*.78,h*.26,8);ctx.fill();rr(-w*.39,-h*.02,w*.78,h*.24,8);ctx.fill();
  ctx.fillStyle="#20b75f";ctx.fillRect(-w/2,h*.12,w,h*.16);
  ctx.fillStyle="#050712";ctx.font=`900 ${Math.max(9,w*.18)}px system-ui`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("DANFO",0,h*.2);
  ctx.fillStyle="#f7fdff";ctx.shadowBlur=14;ctx.shadowColor="#fff7ae";ctx.fillRect(-w*.38,-h*.47,w*.22,6);ctx.fillRect(w*.16,-h*.47,w*.22,6);
  ctx.shadowBlur=24;ctx.shadowColor="#13f2ff";ctx.strokeStyle="#13f2ff";ctx.lineWidth=2;rr(-w*.52,-h*.52,w*1.04,h*1.04,16);ctx.stroke();
  ctx.restore();ctx.globalAlpha=1;
}
function drawParticles(){
  ctx.save();
  for(const p of particles){
    const a=clamp(p.life/p.max,0,1);ctx.globalAlpha=a;ctx.shadowBlur=14;ctx.shadowColor=p.c;ctx.fillStyle=p.c;
    ctx.beginPath();ctx.arc(p.x,p.y,p.sz*(.5+a),0,Math.PI*2);ctx.fill();
  }
  ctx.restore();ctx.globalAlpha=1;
}
function drawHUD(){
  ctx.save();
  const fs=Math.max(14,Math.min(22,W*.043));
  ctx.font=`800 ${fs}px system-ui`;ctx.textBaseline="top";ctx.shadowBlur=12;ctx.shadowColor="#13f2ff";ctx.fillStyle="#e9fbff";
  ctx.textAlign="left";ctx.fillText("₦ "+Math.floor(score).toLocaleString(),18,14);
  ctx.font=`700 ${fs*.72}px system-ui`;ctx.fillStyle="#9cf9ff";ctx.fillText("HI "+Math.floor(high).toLocaleString(),18,16+fs*1.15);
  ctx.textAlign="right";ctx.shadowColor="#ffd21a";ctx.fillStyle="#ffd21a";ctx.font=`900 ${fs}px system-ui`;ctx.fillText(pax+"/"+WIN_PAX+" PAX",W-18,14);
  ctx.fillStyle="#ff5ee7";ctx.font=`800 ${fs*.76}px system-ui`;ctx.fillText("RUSH "+level,W-18,18+fs*1.15);
  for(let i=0;i<3;i++){
    ctx.globalAlpha=i<lives?1:.2;ctx.shadowColor="#ff2bd6";ctx.fillStyle="#ff2bd6";
    const x=18+i*(fs*1.15),y=54+fs;
    ctx.beginPath();ctx.moveTo(x,y+fs*.38);ctx.bezierCurveTo(x-fs*.65,y-fs*.15,x-fs*.28,y-fs*.62,x,y-fs*.28);ctx.bezierCurveTo(x+fs*.28,y-fs*.62,x+fs*.65,y-fs*.15,x,y+fs*.38);ctx.fill();
  }
  ctx.globalAlpha=1;ctx.restore();
}
function drawTitle(){
  drawBackground();drawRoad();
  ctx.save();
  ctx.fillStyle="rgba(0,0,0,.38)";ctx.fillRect(0,0,W,H);
  const cy=H*.25+Math.sin(time*2)*5;
  neonText("DANFO",W/2,cy,Math.min(70,W*.16),"#ffd21a");
  neonText("RUSH",W/2,cy+Math.min(64,W*.145),Math.min(78,W*.18),"#13f2ff");
  ctx.textAlign="center";ctx.textBaseline="middle";ctx.font=`800 ${Math.max(15,Math.min(24,W*.05))}px system-ui`;ctx.shadowBlur=16;ctx.shadowColor="#ff2bd6";ctx.fillStyle="#ffb7f3";
  ctx.fillText("Neon Lagos passenger run",W/2,cy+Math.min(132,W*.31));
  const bx=W/2,by=H*.63,bw=Math.min(330,W*.76),bh=62;
  ctx.shadowBlur=28;ctx.shadowColor="#13f2ff";ctx.strokeStyle="#13f2ff";ctx.lineWidth=2;rr(bx-bw/2,by-bh/2,bw,bh,20);ctx.stroke();
  ctx.fillStyle="rgba(19,242,255,.08)";rr(bx-bw/2,by-bh/2,bw,bh,20);ctx.fill();
  neonText("TAP / ENTER TO START",bx,by,Math.max(16,Math.min(22,W*.045)),"#f7fdff");
  ctx.shadowBlur=0;ctx.fillStyle="#9cf9ff";ctx.font=`700 ${Math.max(13,Math.min(18,W*.038))}px system-ui`;
  ctx.fillText("← → / A D to switch lanes  •  P to pause",W/2,by+62);
  ctx.fillStyle="#ffd21a";ctx.fillText("High Score ₦ "+Math.floor(high).toLocaleString(),W/2,by+92);
  ctx.restore();
}
function overlay(title,sub,color){
  ctx.save();ctx.fillStyle="rgba(2,3,10,.68)";ctx.fillRect(0,0,W,H);
  neonText(title,W/2,H*.38,Math.min(60,W*.14),color);
  ctx.textAlign="center";ctx.textBaseline="middle";ctx.shadowBlur=14;ctx.shadowColor="#13f2ff";ctx.fillStyle="#e9fbff";ctx.font=`800 ${Math.max(17,Math.min(25,W*.052))}px system-ui`;
  ctx.fillText(sub,W/2,H*.5);
  ctx.fillStyle="#ffd21a";ctx.font=`900 ${Math.max(20,Math.min(34,W*.07))}px system-ui`;ctx.fillText("₦ "+Math.floor(score).toLocaleString(),W/2,H*.57);
  ctx.fillStyle="#9cf9ff";ctx.font=`700 ${Math.max(14,Math.min(19,W*.041))}px system-ui`;ctx.fillText("High ₦ "+Math.floor(high).toLocaleString(),W/2,H*.62);
  ctx.strokeStyle="#13f2ff";ctx.lineWidth=2;ctx.shadowBlur=20;ctx.shadowColor="#13f2ff";
  const bw=Math.min(300,W*.72),bh=58;rr(W/2-bw/2,H*.72-bh/2,bw,bh,18);ctx.stroke();
  neonText("TAP / ENTER TO RESTART",W/2,H*.72,Math.max(15,Math.min(20,W*.042)),"#f7fdff");
  ctx.restore();
}
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);
  if(state==="title"){drawTitle();return}
  drawBackground();
  ctx.save();
  if(shake>0)ctx.translate((Math.random()*2-1)*shake,(Math.random()*2-1)*shake);
  drawRoad();
  for(const p of passengers)drawPassenger(p);
  for(const o of obstacles)drawVehicle(o);
  if(player)drawBus();
  drawParticles();
  ctx.restore();
  drawHUD();
  if(flash>0){ctx.fillStyle=`rgba(255,255,255,${Math.min(.35,flash)})`;ctx.fillRect(0,0,W,H)}
  if(state==="paused")overlay("PAUSED","P or tap pause to resume","#13f2ff");
  if(state==="over")overlay("LAST BUS!","Collision ended the run","#ff2bd6");
  if(state==="win")overlay("TERMINAL REACHED","All passengers delivered","#39ff88");
}
function loop(t){
  const dt=Math.min(.033,Math.max(0,(t-last)/1000||0));last=t;
  if(state==="title")time+=dt;
  if(state==="playing")update(dt);else{shake=Math.max(0,shake-dt*20);flash=Math.max(0,flash-dt)}
  draw();requestAnimationFrame(loop);
}
reset();requestAnimationFrame(loop);
})();
</script>
